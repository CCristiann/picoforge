<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat locale · picoforge</title>
<style>
:root{--paper:#f4f7fa;--ink:#173048;--muted:#55697b;--blue:#3157ce;--teal:#12695e;--line:#d8e1e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Avenir Next",Avenir,system-ui,sans-serif}button,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.5}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #3157ce;outline-offset:3px}header{position:sticky;top:0;z-index:2;padding:22px 32px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:white}.brand{font-size:23px;font-weight:750;letter-spacing:-1px}.subtitle{color:var(--muted);font-size:14px}.status{margin-left:auto;font-size:13px;color:var(--teal);max-width:35ch}button{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:10px 16px}main{max-width:824px;margin:0 auto;padding:30px 32px 300px}.welcome{padding:8vh 0 32px}.welcome h1{font-size:clamp(32px,5vw,46px);font-weight:600;line-height:1.15;letter-spacing:-1.5px;margin:0 0 20px}.welcome p{color:var(--muted);max-width:47ch}.suggestions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.suggestions button{font-size:14px;text-align:left}.message{margin:0 0 32px;overflow-wrap:anywhere}.message h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:650}.message .content{white-space:pre-wrap}.message.user{background:#e5edf5;padding:18px 22px;border-radius:12px;margin-left:40px}.message.user h2{color:var(--ink)}.message pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9eef4;border-radius:8px;padding:16px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.composer-wrap{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--paper) 18px);padding:26px 24px 20px}.composer{max-width:760px;margin:auto;border:1px solid #bacadb;background:white;border-radius:16px;padding:18px;box-shadow:0 10px 35px #1730480b}label[for=prompt]{font-size:13px;font-weight:650}textarea{display:block;resize:vertical;min-height:74px;max-height:220px;width:100%;border:0;background:transparent;color:var(--ink);padding:8px 0 12px}textarea:focus{outline:none}textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}.actions{display:flex;align-items:center;gap:10px}.actions label{font-size:12px;color:var(--muted)}select{border:1px solid var(--line);border-radius:5px;padding:6px;background:white;color:var(--ink);font-size:13px}#send{background:var(--blue);border-color:var(--blue);color:white;margin-left:auto}#stop{color:#973e2d;border-color:#d6b4aa}.metrics{font-size:12px;color:var(--muted);padding:12px 0 0;min-height:30px}.foot{max-width:760px;margin:8px auto 0;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}#error{max-width:760px;margin:0 auto 10px;padding:12px 16px;border-left:3px solid #ab4327;background:#fff2eb;font-size:14px;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:600px){header{padding:16px;gap:10px;flex-wrap:wrap}.brand{font-size:21px}.subtitle{font-size:12px}.status{order:3;margin:0;max-width:none;width:100%}#reset{margin-left:auto;font-size:12px;padding:8px 10px}main{padding:20px 18px 310px}.welcome{padding-top:4vh}.message.user{margin-left:18px}.composer-wrap{padding:26px 12px 12px}.composer{padding:14px}.actions{flex-wrap:wrap;gap:8px}.actions label{max-width:60px}.actions button{padding:9px 12px}.foot{font-size:10px}.metrics{font-size:11px}}
</style>
</head>
<body>
<header><span class="brand">picoforge</span><span class="subtitle">Chat locale</span><span class="status" id="status" role="status">Caricamento del modello…</span><button id="reset" disabled>Nuova conversazione</button></header>
<main><section class="welcome" id="welcome"><h1>Cosa vuoi costruire?</h1><p>Scrivi codice, esplora un problema o ragiona in italiano. Qwen3.8-Flash-Next Q2 risponde su questo Mac.</p><div class="suggestions"><button data-prompt="Scrivi una funzione Python che unisca intervalli sovrapposti. Includi un esempio.">Una funzione Python</button><button data-prompt="Spiega in italiano la differenza tra una copia di backup e una prova di ripristino.">Una spiegazione chiara</button></div></section><div id="messages" aria-label="Conversazione"></div></main>
<div class="composer-wrap"><div id="error" role="alert" hidden></div><form class="composer" id="form"><label for="prompt">Messaggio</label><textarea id="prompt" placeholder="Scrivi qui…" required maxlength="65000" disabled></textarea><div class="actions"><label for="max-new">Limite risposta</label><select id="max-new"><option value="64">64 token</option><option value="128" selected>128 token</option><option value="256">256 token</option><option value="512">512 token</option></select><button type="button" id="stop" hidden>Interrompi</button><button type="submit" id="send" disabled>Invia</button></div><div id="metrics" class="metrics" aria-live="polite">Le metriche appariranno dopo la prima risposta.</div></form><div class="foot"><span>Solo su questo computer</span><span>Invio per inviare · Maiusc+Invio per andare a capo</span></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let busy=false,ready=false,historyKey=null,serverActive=false;
function following(){return document.documentElement.scrollHeight-innerHeight-scrollY<360;}
function follow(){requestAnimationFrame(()=>scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'}));}
const format=x=>Number(x).toLocaleString('it-IT',{maximumFractionDigits:2});
function controls(){const active=busy||serverActive;$('send').disabled=!ready||active;$('prompt').disabled=!ready||active;$('reset').disabled=!ready||active;$('stop').hidden=!active;$('max-new').disabled=active;}
function showError(message){$('error').textContent=message;$('error').hidden=!message;}
function addMessage(role,text){$('welcome').hidden=true;const node=document.createElement('article');node.className='message '+role;const title=document.createElement('h2');title.textContent=role==='user'?'Tu':'picoforge';const content=document.createElement('div');content.className='content';content.textContent=text;node.append(title,content);$('messages').append(node);return content;}
function renderContent(node,text){node.replaceChildren();const parts=text.split('```');parts.forEach((part,i)=>{const el=document.createElement(i%2?'pre':'span');el.textContent=i%2?part.replace(/^[a-z0-9_+-]*\n/i,''):part;node.append(el);});}
function metrics(d){if(d.event!=='done')return;const tps=d.decode_tokens&&d.decode_s>0?format(d.decode_tokens/d.decode_s)+' token/s':'—';$('metrics').textContent=(d.stop_reason==='cancelled'?'Interrotta · ':'')+'Primo token '+(d.ttft_request_s===null?'—':format(d.ttft_request_s)+' s')+' · '+tps+' · '+d.generated_tokens+' token · '+(d.prompt_tokens+d.generated_tokens)+'/'+d.context+' token totali'+(d.metal_allocated_bytes?' · '+format(d.metal_allocated_bytes/2**30)+' GiB Metal':'');}
async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok){const d=await r.json();throw Error(d.error||'Richiesta fallita');}return r;}
async function poll(){try{const r=await fetch('/api/status'),d=await r.json();ready=d.state==='ready';serverActive=d.active;if(!busy||!ready)$('status').textContent=d.state==='error'?'Motore non disponibile':!ready?'Caricamento del modello / attesa GPU…':busy||d.active?'Generazione in corso…':'Modello pronto';if(d.error)showError(d.error);if(ready&&!busy&&JSON.stringify(d.messages)!==historyKey){historyKey=JSON.stringify(d.messages);$('messages').replaceChildren();d.messages.forEach(m=>renderContent(addMessage(m.role,''),m.content));$('welcome').hidden=d.messages.length>0;if(d.metrics)metrics(d.metrics);}controls();}catch(e){ready=false;$('status').textContent='Servizio non raggiungibile';showError('La connessione locale è interrotta. Verifica che il servizio sia avviato.');controls();}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy||serverActive||!ready)return;const prompt=$('prompt').value.trim();if(!prompt)return;busy=true;showError('');$('status').textContent='Preparazione della richiesta…';controls();addMessage('user',prompt);const answer=addMessage('assistant','');follow();let text='';$('prompt').value='';try{const r=await post('/api/generate',{prompt,max_new:Number($('max-new').value)}),reader=r.body.getReader(),decoder=new TextDecoder();let pending='',completed=false;while(true){const {done,value}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=pending.split('\n');pending=lines.pop();for(const line of lines){if(!line)continue;const event=JSON.parse(line);if(event.event==='started'){$('status').textContent='Lettura della conversazione…';}else if(event.event==='prefill'){$('status').textContent='Lettura: '+event.completed+'/'+event.prompt_tokens+' token';}else if(event.event==='token'){const keepFollowing=following();text+=event.text;renderContent(answer,text);if(keepFollowing)follow();$('status').textContent='Generazione in corso…';}else if(event.event==='done'){completed=true;metrics(event);if(event.stop_reason==='cancelled'&&!text)$('prompt').value=prompt;$('status').textContent=event.stop_reason==='cancelled'?'Generazione interrotta':event.stop_reason==='length'?'Limite di risposta raggiunto':'Modello pronto';}else if(event.event==='error'){throw Error(event.message);}}if(done){if(!completed||pending.trim())throw Error('La risposta del servizio è incompleta.');break;}}}catch(error){showError(error.message);if(!$('prompt').value)$('prompt').value=prompt;}finally{try{const d=await (await fetch('/api/status')).json();serverActive=d.active;$('messages').replaceChildren();d.messages.forEach(m=>renderContent(addMessage(m.role,''),m.content));$('welcome').hidden=d.messages.length>0;}catch(_){}busy=false;controls();$('prompt').focus();}});
$('stop').addEventListener('click',async()=>{try{await post('/api/stop');$('status').textContent='Arresto dopo il lavoro GPU in corso…';}catch(e){showError(e.message);}});
$('reset').addEventListener('click',async()=>{try{await post('/api/reset');$('messages').replaceChildren();$('welcome').hidden=false;$('metrics').textContent='Nuova conversazione.';showError('');$('prompt').value='';$('prompt').focus();}catch(e){showError(e.message);}});
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit();}});
document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{$('prompt').value=b.dataset.prompt;$('prompt').focus();}));poll();setInterval(poll,2000);
</script>
</body>
</html>
